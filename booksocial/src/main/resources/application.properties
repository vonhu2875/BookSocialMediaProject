spring.application.name=booksocial
logging.level.org.springframework.security=DEBUG
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/booksocial
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
#Tự động cập nhật cấu trúc cơ sở dữ lệu mỗi khi ứng dụng khởi động
spring.jpa.hibernate.ddl-auto=update

#Show các câu lệnh SQL mà Hibernate tự động tạo ra và thực thi
spring.jpa.show-sql=true

#Cấu hình jwt
jwt.secret=
jwt.expiration=86400000

#Cloudinary
cloudinary.cloud-name=dqrfckaek
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

#Google Gemini AI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

//Login google
google.client.id=${GOOGLE_CLIENT_ID}

# ================== RAG: pgvector Vector Store ==================
# Tự tạo bảng vector_store + extension khi khởi động (chỉ nên bật true ở dev,
# ở production nên tạo schema thủ công 1 lần rồi tắt để tránh rủi ro)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Số chiều VECTOR phải khớp CHÍNH XÁC với model embedding bên dưới (text-embedding-004 = 768)
spring.ai.vectorstore.pgvector.dimensions=768

# ================== Embedding Model (Google GenAI) ==================
# text-embedding-004 đã bị Google deprecate/tắt hoàn toàn từ 14/1/2026
# -> chuyển sang gemini-embedding-001, ép output về 768 chiều để khớp pgvector.dimensions bên dưới
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

